name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ['3.2', '3.3', '3.4']
        exclude:
          # Only test Ruby 3.4 on macOS to minimize CI minutes
          - os: macos-latest
            ruby: '3.2'
          - os: macos-latest
            ruby: '3.3'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run specs
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            bundle exec rspec --exclude-pattern "spec/rble/bluez/**/*,spec/rble/backend/bluez_spec.rb,spec/integration/**/*"
          else
            bundle exec rspec
          fi
      - name: Verify gem builds
        run: gem build rble.gemspec
